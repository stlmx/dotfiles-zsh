"$schema" = "https://starship.rs/config-schema.json"

# 胶囊式（内侧左右各留一格，圆角不压字）：每段独立圆角，段间留一格空；无 git 时不出现空色块；时间右对齐。
# 图标统一用 Material Design 系（󰀵 󰘬 󰅐），大小一致。
add_newline = true
command_timeout = 1000
palette = "halfbit_pastel"

format = """
[](fg:rose)\
$os\
$username\
${env_var.DOTFILES_PROMPT_HOST}\
[ ](bg:rose)[](fg:rose) \
$directory\
$git_branch\
${env_var.GITC_STATUS}\
${env_var.GITC_SYNCED}\
$fill\
$time\
$line_break\
$character"""

[palettes.halfbit_pastel]
ink = "#11131f"
rose = "#f77fa5"
peach = "#f7b383"
butter = "#efe0a1"
mint = "#9adf9b"
sky = "#8cc9ec"
lavender = "#b8c5ff"
green = "#9de18d"
red = "#ff6b6b"

[os]
disabled = false
style = "fg:ink bg:rose"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Linux = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Arch = "󰣇"
Alpine = ""

[username]
show_always = true
style_user = "fg:ink bg:rose bold"
style_root = "fg:ink bg:rose bold"
format = "[$user]($style)"

[env_var.DOTFILES_PROMPT_HOST]
style = "fg:ink bg:rose bold"
format = "[@$env_value]($style)"

[directory]
style = "fg:ink bg:peach bold"
format = "[](fg:peach)[ $path ]($style)[$read_only]($read_only_style)[](fg:peach)"
read_only = " 󰌾"
read_only_style = "fg:ink bg:peach"
truncation_length = 0
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"

[git_branch]
symbol = "󰘬"
style = "fg:ink bg:butter bold"
format = " [](fg:butter)[ $symbol $branch ]($style)[](fg:butter)"

# git 状态不再实时扫描：由 zsh/git-status-cache.zsh 生成快照（进入新仓库自动算一次，Ctrl+X Ctrl+G 手动刷新）
[env_var.GITC_STATUS]
style = "fg:butter bold"
format = "[ $env_value]($style)"

[env_var.GITC_SYNCED]
format = "[ ✓](bold fg:green)"

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:ink bg:lavender bold"
format = "[](fg:lavender)[ 󰅐 $time ]($style)[](fg:lavender)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
