"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000
palette = "halfbit_pastel"

format = """
[](rose)\
$os\
$username\
$hostname\
[](fg:rose bg:peach)\
$directory\
[](fg:peach bg:butter)\
$git_branch\
$git_status\
[](fg:butter bg:mint)\
[](fg:mint bg:sky)\
[](fg:sky bg:lavender)\
$time\
[ ](fg:lavender)\
$line_break\
$character"""

[palettes.halfbit_pastel]
ink = "#11131f"
rose = "#f77fa5"
peach = "#f7b383"
butter = "#efe0a1"
mint = "#9adf9b"
sky = "#8cc9ec"
lavender = "#b8c5ff"
green = "#9de18d"
red = "#ff6b6b"

[os]
disabled = false
style = "fg:ink bg:rose"
format = "[ $symbol]($style)"

[os.symbols]
Macos = ""
Linux = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Arch = "󰣇"
Alpine = ""

[username]
show_always = true
style_user = "fg:ink bg:rose bold"
style_root = "fg:ink bg:rose bold"
format = "[ $user]($style)"

[hostname]
ssh_only = true
style = "fg:ink bg:rose bold"
format = "[@$hostname ]($style)"

[directory]
style = "fg:ink bg:peach bold"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = ""
style = "fg:ink bg:butter bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:ink bg:butter bold"
format = "[$all_status$ahead_behind ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:ink bg:lavender bold"
format = "[  $time ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
