# tmux 配置：各机器共用，install.sh 把它软链到 ~/.tmux.conf；本机专属的设置放 ~/.tmux.conf.local（末尾加载）。
# 需要 tmux 3.2 以上和支持真彩色的终端（Ghostty、iTerm2 等）。

set -g prefix `
unbind C-b
bind `  send-prefix
set -g escape-time 20
set -g mouse on

# 底栏：暮紫。偏暗偏灰的紫色底，只比深色终端亮一点；米白字，会话名浅粉；你所在的窗口挖成终端底色
# （bg=terminal），像浏览器的当前标签。试过：tmux 默认的实心绿看着厚，完全透明找不到，浅色底刺眼。
# 颜色在 OKLCH 里挑，按 WCAG 算过对比度：名字和时间 >= 7，其余文字和三个标记 >= 4.6（底色上、深色终端底上都算）。
# 十六进制要小写：#D、#F、#H… 是 tmux 的格式别名。其他窗口：灰 = 没动静，米白 = 响过铃（Claude 答完或在等授权）还没看。
set -g status-style 'bg=#4f4866 fg=#f1eadc'
set -g status-left-length 40
set -g status-left '#[fg=#fecee8 bold] #{session_name} '
set -g status-right-length 60
# 时钟默认是本机时区；服务器跑在 UTC 又想看别的时区，在 ~/.tmux.conf.local 里改 @clock（见示例）。
set -g @clock '%m-%d %H:%M'
set -g status-right '#[fg=#c7c0b3]#{=/32/…:pane_title}   #[fg=#f1eadc]#{T:@clock} '
set -g window-status-separator ''
set -g window-status-style 'fg=#c7c0b3'
set -g window-status-current-style 'bg=terminal fg=#f1eadc bold'
set -g window-status-bell-style 'fg=#f1eadc'
set -g window-status-activity-style 'fg=#f1eadc'
# fill：tmux 3.7 起提示只盖住文字那一段，要 fill 才铺满整行
set -g message-style 'bg=#594324 fg=#e7e1d3 bold fill=#594324'

# Claude Code 的会话状态：窗口名前绿 ✓ = 答完在等你，黄 ? = 等你授权，红 ! = 撞了额度或接口出错。
# 由 Claude Code 的钩子写窗口选项 @claude（VPS 上是 ~/.claude/hooks/session-state.sh）；没装钩子的机器上不显示。
set -g @claude-mark '#{?#{==:#{@claude},done},#[fg=#85cf95]✓ #[default],}#{?#{==:#{@claude},ask},#[fg=#e6b96b]? #[default],}#{?#{||:#{==:#{@claude},limit},#{==:#{@claude},error}},#[fg=#ffaba3]! #[default],}'
set -g window-status-format ' #I #{E:@claude-mark}#W#{?window_zoomed_flag, Z,} '
set -g window-status-current-format ' #I #{E:@claude-mark}#W#{?window_zoomed_flag, Z,} '

# 本机专属的设置（时区、快捷键等），没有这个文件就跳过
source-file -q ~/.tmux.conf.local
